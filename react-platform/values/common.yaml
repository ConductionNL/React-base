---
# common.yaml — base config for every WOO PWA tenant in every environment.
# Tenant files extend this; environment files (env/*.yaml) override env-specific
# bits. Anything in here applies to all tenants on every cluster.
#
# Convention: never put hostname or upstream-host patterns in here — those are
# environment-specific (env/*.yaml) or computed by the ApplicationSet template.

# ---------- Image ----------
# Image tag is pinned at the platform level (NEVER `latest`). Bumping the tag
# is a platform-wide change en valt onder de AppProject sync window
# (see argo/projects/react-platform.yaml).
#
# Huidige pin: `v1.0.0` op ghcr.io. Digest (informatief — niets dwingt hem af,
# de Deployment pullt op tag):
#   sha256:945b3d0510d8d7c3cc2fbc078c06de9bc6382611728c062c26c84043222b732f
#
# Waarom ghcr.io en niet Docker Hub: het Docker Pro-PAT is op 2026-08-03
# verlopen en wordt niet vernieuwd, dus de vloot pullt daar weer anoniem onder
# de limiet van 100 pulls per 6 uur per IP. ghcr.io kent die limiet niet voor
# publieke images en vraagt geen pull-secret in de namespace (er is er ook geen
# geconfigureerd). Zie cluster-config/docs/mirror.md.
#
# Per-tenant override: `tenant.frontend.registry` / `.repository` / `.tag` in
# het tenant-bestand in Nextcloud-base. Sinds 2026-08-11 is zo'n pin BINDEND —
# Argo reconcilieert de image dan, ook op een bestaande Deployment. Pint een
# tenant niets, dan geldt deze default en blijft de image live bijstelbaar in
# de Argo UI. Zie docs/ROLLOUTS.md § "Per-tenant image-pin".
#
# LET OP bij het wijzigen van deze regel: de chart bouwt één string
# ("<pwa.image.image>:<pwa.image.tag>"), dus een tenant die alléén een `tag`
# pint erft dit image-pad. Een registry-wissel hier verhuist die tenants dus
# mee. Daarom staan de 23 legacy Docker Hub-tenants sinds 2026-08-12 met een
# expliciete `registry` + `repository` in hun tenant-bestand: die blijven
# bewust op docker.io/conduction2022 tot ze apart en gefaseerd naar ghcr gaan.
# Hun tags bestaan niet 1-op-1 op ghcr (`V1.0.260422-development` heet daar
# omgedraaid `development-V1.0.260422`), dus die migratie is niet enkel een
# registry-wissel. Zie CHANGELOG.md 2026-08-12 en MIGRATION.md.
pwa:
  image:
    image: ghcr.io/conductionnl/woo-website-v2
    pullPolicy: IfNotPresent
    tag: "v1.0.0"
# ---------- Pod placement ----------
# Frontends co-locate on the Nextcloud nodepool (status quo from
# create_react.sh). A future openspec change can move them off; until then
# this is platform default.
nodeSelector:
  role: prod-nextcloud
tolerations:
  - key: nextcloud-only
    operator: Equal
    value: "true"
    effect: NoSchedule
# ---------- Service ----------
# Chart Service maps to container port 8080 (nginx in pwa/Dockerfile).
service:
  type: ClusterIP
  port: 80
# ---------- Ingress ----------
# Ingress class is cluster-wide (ingress-nginx). Hostname and TLS secret are
# computed per-tenant by the ApplicationSet template.
# DNS records are auto-managed by cluster-infra/external-dns based on the
# Ingress hostname — no Cloudflare action when adding/removing tenants.
ingress:
  enabled: true
  className: nginx
  pathType: ImplementationSpecific
# ---------- Gateway ----------
# Chart-internal flag. Keep on (matches today's manifests).
gateway:
  enabled: true
# ---------- Service account ----------
# Dedicated SA per release (least-privilege, no default-SA hijack).
serviceAccount:
  create: true
# ---------- Security ----------
# Pod-level: non-root, seccomp default, fsGroup matches runAsGroup so mount
# permissions line up. Values match the chart's platform-grade defaults but
# are pinned here so a chart-default change doesn't silently relax security.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 101 # nginx UID in nginx:alpine
  runAsGroup: 101
  fsGroup: 101
  seccompProfile:
    type: RuntimeDefault
# Container-level: drop all caps, no privilege escalation. readOnlyRootFilesystem
# stays off until 30-generate-runtime.sh writes to a tmpfs instead of image-fs
# (see chart pwa/Dockerfile).
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  runAsNonRoot: true
  runAsUser: 101
  runAsGroup: 101
  capabilities:
    drop:
      - ALL
# ---------- Probes ----------
# Pinned (chart defaults are sane for static nginx).
livenessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 5
  periodSeconds: 30
  timeoutSeconds: 3
  failureThreshold: 3
readinessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 2
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3
# ---------- Resources (platform default) ----------
# Static nginx → tiny baseline. env/*.yaml can override for prod-tier.
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi
# ---------- NetworkPolicies ----------
# Policies live in the vendored chart at templates/networkpolicy.yaml.
# Pod-label scoped (`app.kubernetes.io/part-of: react-platform`) to coexist
# with Nextcloud co-tenant policies in the same namespace.
networkPolicy:
  enabled: true
  ingressNamespace: ingress-nginx
