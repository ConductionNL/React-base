spec:
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
      jqPathExpressions:
        - '.spec.template.spec.containers[].env[] | select(.name | test("^(GATSBY_|NL_DESIGN_)"))'
    - group: autoscaling
      kind: HorizontalPodAutoscaler
      jsonPointers:
        - /status

