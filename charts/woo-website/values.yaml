# Default values for woo-website chart.
# Platform-grade hardening — zie CHANGELOG voor breaking-change-overwegingen.

pwa:
  image:
    # NB: oorspronkelijke key is `image.image` (niet de standaard `image.repository`).
    # Behouden voor backward compat met bestaande deployments.
    image: "ghcr.io/conductionnl/woo-website-v2"
    pullPolicy: IfNotPresent
    # `latest` is drift-bron — pin op platform-niveau (bv. in react-base
    # values/common.yaml) of override per tenant. Default blijft `latest`
    # zodat bestaande Application-YAMLs blijven werken tot ze migreren.
    tag: "latest"
  upstream:
    host: ""
    base: ""
  # Reserved voor toekomstige runtime-config (theming via ConfigMap i.p.v.
  # build-time GATSBY_* args). Op dit moment ongebruikt; zie config-runtime.yaml.
  runtime: {}
  # Free-form env-vars naar de pod. Gebruikt door 30-generate-runtime.sh
  # (NL_DESIGN_THEME_CLASSNAME, GATSBY_FAVICON_URL, etc.).
  env: {}

replicaCount: 2

global:
  domain: woo.commonground.nu
  tls: true

gateway:
  enabled: true
  # Trusted proxies: vul met internal LB-IP als achter HTTPS-only LB
  # config:
  #   trustedProxies: []

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Dedicated SA per release — least-privilege, geen default-SA hergebruik.
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

# Pod-niveau security: non-root, seccomp default profile.
# fsGroup matched runAsGroup zodat mount-permissies kloppen.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 101    # nginx uid in nginx:alpine
  runAsGroup: 101
  fsGroup: 101
  seccompProfile:
    type: RuntimeDefault

# Container-niveau security: drop alle caps, geen privilege escalatie.
# readOnlyRootFilesystem staat UIT omdat 30-generate-runtime.sh runtime.json
# schrijft naar /usr/share/nginx/html (= image-fs). Future fix: entrypoint
# laten schrijven naar /var/cache/runtime + nginx-config aanpassen.
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  runAsNonRoot: true
  runAsUser: 101
  runAsGroup: 101
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: true
  path: ""
  pathType: ImplementationSpecific
  className: nginx
  annotations: {}
  hosts:
  tls: []

# Bestanden onder /.well-known/, per tenant meegegeven vanuit het tenant-bestand
# in Nextcloud-base (`tenant.frontend.wellKnown`). Leeg = niets extra; dan blijft
# staan wat het image zelf serveert.
#
# Gebruikt voor de ondertekende `security.txt` (RFC 9116) en de bijbehorende
# publieke PGP-sleutel waar het `Encryption`-veld naar wijst. De inhoud gaat als
# ConfigMap met een subPath-mount over het bestand in de image-fs.
#
# De inhoud is PGP-ondertekend: byte-exact overnemen, nooit met de hand
# bijwerken. Een gewijzigde regel maakt de signatuur ongeldig en dat is aan de
# buitenkant niet te zien.
wellKnown:
  files: {}
    # security.txt: |
    #   -----BEGIN PGP SIGNED MESSAGE-----
    #   ...

# Security-response-headers op élke response. Eén bron voor twee datapaden:
# de Ingress (ingress-nginx, `more_set_headers`) en de HTTPRoute (Envoy
# Gateway, `ResponseHeaderModifier`), zodat een tenant tijdens de migratie
# dezelfde headers krijgt via welk pad zijn verkeer ook loopt.
#
# Aanleiding: audit op open.dinkelland.nl (2026-08-18). Gemeten ontbraken CSP,
# X-Frame-Options en Referrer-Policy; HSTS en X-Content-Type-Options werden al
# geserveerd (respectievelijk door ingress-nginx en door de nginx in de pod).
# Dit is de internet.nl-set; COOP/Permissions-Policy staan er bewust niet in.
#
# Beide mechanismen ZETTEN de header (en plakken er geen tweede bij zoals
# nginx' `add_header` doet), dus een header die de pod zelf al stuurt blijft
# enkelvoudig.
#
# CSP staat bewust op Report-Only. Gemeten in de live bundel: één inline
# `<script>` (de Gatsby-loader, hash wisselt per build), 39 inline
# `style=`-attributen, fonts van fonts.gstatic.com en db.onlinewebfonts.com, en
# branding-afbeeldingen van een externe host per tenant. Report-Only meldt
# overtredingen in de browserconsole zonder de site te breken; enforce (dezelfde
# waarde onder `Content-Security-Policy`) pas nadat dat per tenant gemeten is.
securityHeaders:
  enabled: true
  headers:
    X-Frame-Options: "DENY"
    Referrer-Policy: "no-referrer"
    Content-Security-Policy-Report-Only: "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://db.onlinewebfonts.com; font-src 'self' data: https://fonts.gstatic.com https://db.onlinewebfonts.com; img-src 'self' data: https://raw.githubusercontent.com; connect-src 'self' https://*.commonground.nu"

# Gateway API-route naast de Ingress (migratie weg van ingress-nginx).
# Uit tenzij de tenant `gateway.frontend: true` zet — bestaande tenants
# renderen dus niets extra's. Zie React-base/docs/GATEWAY-API.md.
gatewayRoute:
  enabled: false
  gateway:
    name: platform-gateway
    namespace: envoy-gateway-system
    # De listener waar de route aan hangt. Hosts onder *.accept.openwoo.app en
    # *.openwoo.app vallen onder het gedeelde wildcard-certificaat; een
    # custom-domain tenant heeft een eigen listener met een eigen cert nodig en
    # zet deze waarde daarop.
    sectionName: https-openwoo

# Static-site nginx → laag baseline-verbruik, room voor traffic-spikes.
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

# Probes — explicit i.p.v. K8s defaults.
livenessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 5
  periodSeconds: 30
  timeoutSeconds: 3
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 2
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

nodeSelector: {}
tolerations: []
affinity: {}

# NetworkPolicies — added by react-base (not in upstream chart). See
# templates/networkpolicy.yaml. Toggle off for testing or environments
# without NetworkPolicy support.
networkPolicy:
  enabled: true
  # Namespace where the ingress controller lives — used by the
  # allow-ingress policy. Override if your cluster runs ingress-nginx
  # in a non-standard namespace.
  ingressNamespace: ingress-nginx
